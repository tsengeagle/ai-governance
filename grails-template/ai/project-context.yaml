project:
  system: HIS
  repo_name: EventServer
  module_name: EventServer
  role: ESB
  description: EventServer is a critical component of the Hospital Information System (HIS) that serves as an Enterprise Service Bus (ESB) to facilitate communication and data exchange between various subsystems. It ensures seamless integration and interoperability across different modules of the HIS, enabling efficient data flow and real-time processing of events. The EventServer is responsible for handling high volumes of events, ensuring reliability, scalability, and security in the healthcare environment.
  criticality: high
  legacy: true

organization:
  architecture_style: SOA
  repo_scope: single-architecture-per-repo
  cross_repo_assumption: forbidden

tech_stack:
  backend_language: Groovy
  backend_framework: Grails 3.2.9 on Spring Boot
  frontend_framework: GSP + jQuery 2.2.0 via Grails asset-pipeline
  orm: GORM 6.0.10.RELEASE with Hibernate 5.1.3
  build_tool: Gradle 3.4.1 wrapper
  api_styles:
    - JAX-RS REST resources
    - SOAP/Axis2 web services
    - Flex remoting services
    - Server-rendered GSP web UI

architecture:
  primary_entry_points:
    - grails-app/init/eventserver/Application.groovy
    - grails-app/controllers/eventserver/UrlMappings.groovy
    - grails-app/resources/com/hcsaastech/ehis/event/EventResource.groovy
    - grails-app/resources/com/hcsaastech/ehis/event/Axis2MessageResource.groovy
    - grails-app/resources/com/hcsaastech/ehis/event/LabResource.groovy
    - grails-app/services/com/hcsaastech/ehis/event/EventOutsideService.groovy
  orchestration_layer:
    - External event service facade [EventOutsideService]
    - Core event business orchestration service [EventBrImplService]
  persistence_layer: GORM domain model persisted to Oracle via Hibernate/JDBC, centered on EventMst, EventDtl, EventlogMst, EventlogDtl, EventPipelineConfig, and EventPipelineControl.
  external_contracts:
    - SOAP contract exposed by EventOutsideService
    - Flex remoting contract exposed by EventOutsideService
    - External SOAP operations: outsidePublishEvent, outsideSaveEventlogDtl, outsiderePublishEventForJob

constraints:
  compatibility_rules:
    - Existing external SOAP contracts must remain backward compatible.
    - Existing external payload field names and semantics must remain stable unless explicitly versioned.
    - Existing event publishing workflow interfaces must preserve contract compatibility.
  forbidden_changes:
    - No modernization refactor during routine feature work.
    - No implicit cleanup of legacy event flow without validation.
    - No renaming of externally exposed contracts.
    - No structural changes to the publish pipeline without system-owner confirmation.

ai_governance:
  pilot_scope: repository-pilot-for-organization-baseline
  use_shared_rules: true
  workflows:
    - implement-change
    - fix-bug
    - review-code
  commit_protocol: conventional-with-ai-trailers
  required_output:
    - change-summary
    - validation-summary
    - proposed-commit-message