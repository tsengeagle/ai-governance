project:
  system: HIS
  repo_name: <REPO_NAME>
  module_name: <MODULE_NAME>
  role: <REPO_ROLE>
  description: <SHORT_DESCRIPTION>
  criticality: high
  legacy: true

organization:
  architecture_style: AUTO
  repo_scope: single-architecture-per-repo
  cross_repo_assumption: forbidden

tech_stack:
  backend_language: AUTO
  backend_framework: AUTO
  frontend_framework: AUTO
  orm: AUTO
  build_tool: AUTO
  package_manager: AUTO
  api_styles:
    - AUTO
  test_frameworks:
    - AUTO
  e2e_frameworks:
    - AUTO

architecture:
  style: AUTO
  primary_entry_points:
    - AUTO
  orchestration_layer:
    - UNKNOWN
  persistence_layer: AUTO
  external_contracts:
    - UNKNOWN

  frontend:
    app_type: AUTO
    rendering_mode: AUTO
    routing_mode: AUTO
    state_management: AUTO
    style_system: AUTO
    module_boundary: AUTO
    shared_dependencies:
      - UNKNOWN
    entry_points:
      - AUTO
    shell_integration:
      host_shell: UNKNOWN
      integration_contract: UNKNOWN
      mount_rule: UNKNOWN
      route_ownership: UNKNOWN

  microfrontend:
    role: AUTO
    composition_mode: AUTO
    contract_type:
      - UNKNOWN
    forbidden_changes:
      - cross-microfrontend direct imports
      - bypassing shell lifecycle contract
      - hidden shared-state coupling
    compatibility_rules:
      - must preserve mount and unmount contract
      - must preserve route ownership boundary
      - must preserve shared dependency expectations

ui_governance:
  enabled: AUTO
  enterprise_ui_required: true
  enterprise_ui_source:
    type: UNKNOWN
    location: UNKNOWN
    package_name: UNKNOWN
    docs_location: UNKNOWN
  design_tokens:
    required: true
    source: UNKNOWN
  approved_wrapper_pattern: UNKNOWN
  governance_level: enterprise-standard-required

constraints:
  compatibility_rules:
    - UNKNOWN
  forbidden_changes:
    - UNKNOWN

ai_governance:
  pilot_scope: repository-pilot-for-organization-baseline

  governance_repo:
    url: https://gitlab.tzuchi-healthcare.org.tw/tsengeagle/ai-governance
    default_ref: main

  governance_rules:
    mode: explicit-list
    base_path: ai/governance
    required:
      - workflow-invariants.md
      - engineering-principles.md
      - evidence-policy.md
      - validation-and-acceptance-principles.md

  workflow_rules:
    mode: explicit-list
    base_path: ai/workflow
    required:
      - implement-change.md
      - fix-bug.md
      - review-code.md
      - validate-and-accept.md

  use_shared_rules: true
  shared_rules:
    mode: explicit-list
    base_path: ai/shared
    required:
      - ai-working-rules.md
      - architecture-principles.md
      - design-principles.md
      - code-quality-baseline.md
      - contract-and-compatibility-rules.md
      - commit-protocol.md

  workflows:
    - implement-change
    - fix-bug
    - review-code
    - validate-and-accept

  commit_protocol: conventional-with-ai-trailers

  required_output:
    - change-summary
    - validation-summary
    - assumptions-and-pending-confirmation
    - risk-and-uncovered-scope
    - proposed-commit-message
