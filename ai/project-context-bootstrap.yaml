project:
  system: HIS
  repo_name: <repo-name>
  module_name: <module-name>
  role: <repo-role>
  description: <short-description>
  criticality: <high|medium|low>
  legacy: <true|false>

organization:
  architecture_style: SOA
  repo_scope: single-architecture-per-repo
  cross_repo_assumption: forbidden

tech_stack:
  backend_language: AUTO
  backend_framework: AUTO
  frontend_framework: AUTO
  orm: AUTO
  build_tool: AUTO
  api_styles:
    - AUTO

architecture:
  primary_entry_points:
    - AUTO
  orchestration_layer:
    - UNKNOWN
  persistence_layer: AUTO
  external_contracts:
    - UNKNOWN

constraints:
  compatibility_rules:
    - UNKNOWN
  forbidden_changes:
    - UNKNOWN

ai_governance:
  pilot_scope: repository-pilot-for-organization-baseline

  governance_repo:
    url: https://gitlab.tzuchi-healthcare.org.tw/tsengeagle/ai-governance
    default_ref: main

  governance_rules:
    mode: explicit-list
    base_path: ai/governance
    required:
      - workflow-invariants.md
      - engineering-principles.md
      - evidence-policy.md

  workflow_rules:
    mode: explicit-list
    base_path: ai/workflow
    required:
      - implement-change.md
      - fix-bug.md
      - review-code.md

  use_shared_rules: true
  shared_rules:
    mode: explicit-list
    base_path: ai/shared
    required:
      - ai-working-rules.md
      - architecture-principles.md
      - design-principles.md
      - code-quality-baseline.md
      - contract-and-compatibility-rules.md
      - commit-protocol.md

  workflows:
    - implement-change
    - fix-bug
    - review-code

  commit_protocol: conventional-with-ai-trailers

  required_output:
    - change-summary
    - validation-summary
    - assumptions-and-pending-confirmation
    - risk-and-uncovered-scope
    - proposed-commit-message